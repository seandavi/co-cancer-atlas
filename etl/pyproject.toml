[project]
name = "co-cancer-atlas-etl"
version = "0.1.0"
description = "Offline ETL: pull the ECCO API into a reproducible Parquet snapshot for the Colorado Cancer Atlas SPA."
readme = "README.md"
authors = [
    { name = "Sean Davis", email = "seandavi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.3",
    "httpx>=0.28.1",
    "polars>=1.41.0",
    "pyarrow>=24.0.0",
    "tenacity>=9.1.4",
    "topojson>=1.10",
]

[project.scripts]
snapshot = "co_cancer_atlas_etl.snapshot:main"
verify = "co_cancer_atlas_etl.verify:main"
aac-probe = "co_cancer_atlas_etl.aac_probe:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
