# Build the SPA and deploy to Cloudflare Pages.
# Requires repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_PAGES_PROJECT.

name: deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "data/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: stage data for serving
        run: |
          mkdir -p app/public/data
          cp -R data/. app/public/data/ 2>/dev/null || true
      - run: npm run build
        working-directory: app
      - name: deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
